[project]
name = "mbal-bi"
version = "0.1.0"
description = "MBAL BI dashboards on Orion (Oracle ERP, read-only)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001",  # the middle dot and em dash in UI strings are intended
]

[tool.ruff.lint.isort]
known-first-party = ["mbal_bi", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
